{% load utils %}

{% if object_list|python_any %}
    <li class="flex gap-3 text-sm">
        <span class="w-26 shrink-0 !text-neutral-400">{% if object_list|length > 1 %}{{ title_many }}{% else %}{{ title_one }}{% endif %}</span>
        <span>{% for val in object_list %}
            {{ val.name }}{% if not forloop.last %},
            {% endif %}{% endfor %}</span>
    </li>
{% endif %}
