<dialog id="{{ id }}-alert-popup"
        class="my-auto mx-0 py-8 w-screen max-w-none bg-black px-120 backdrop:bg-black/40 backdrop:backdrop-blur-md">

    <h3 class="!text-red-500 font-bold mb-2">
        Вы абсолютно уверены?
    </h3>

    <p>{{ text }}</p>

    <div class="flex justify-end gap-6 mt-4">
        <button class="close-modal flex-center rounded-2xl border-2 border-white py-2 px-4">
            Отмена
        </button>

        <form action="{{ url }}" method="POST" class="flex-center">
            {% csrf_token %}
            <button type="submit" class="!text-red-500">
                Да, удалить
            </button>
        </form>
    </div>
</dialog>
