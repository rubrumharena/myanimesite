{% load static %}


<dialog id="search-popup"
        class="m-auto p-0 w-[700px] max-h-[85vh] rounded-3xl
               bg-gray-950 border border-neutral-700 shadow-[0_32px_80px_rgba(0,0,0,.7)]
               backdrop:bg-black/40 backdrop:backdrop-blur-md
               open:flex open:flex-col">

    <div class="flex items-center gap-3 px-6 pt-6 pb-5 shrink-0">
        <div class="relative flex-1 min-w-0">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none stroke-neutral-500"
                 xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path>
                <path d="M21 21l-6 -6"></path>
            </svg>

            <input id="title-search" data-url="{% url 'titles:search' %}"
                   placeholder="Название аниме" autocomplete="off"
                   class="w-full h-12 pl-11 pr-11 rounded-full text-sm bg-gray-950
                          border-2 border-neutral-700 placeholder:!text-neutral-600
                          hover:border-neutral-500
                          focus:outline-none focus:border-cyan-400 transition-colors">

            <button type="button" title="Очистить"
                    onclick="document.getElementById('title-search').value = ''; document.getElementById('title-search').dispatchEvent(new Event('input', {bubbles: true}));"
                    class="absolute right-3 top-1/2 -translate-y-1/2 flex-center w-7 h-7 rounded-full
                           !text-neutral-500 hover:bg-white/5 hover:!text-white transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6l-12 12"></path>
                    <path d="M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <button type="button" title="Закрыть"
                class="close-modal cross shrink-0 flex-center w-9 h-9 rounded-full
                       !text-neutral-500 hover:bg-white/5 hover:!text-white transition-colors">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6l-12 12"></path>
                <path d="M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <div id="search-content"
         class="flex-1 min-h-0 overflow-y-auto px-6 pb-6
                [scrollbar-gutter:stable]
                [&::-webkit-scrollbar]:w-1.5
                [&::-webkit-scrollbar-track]:bg-transparent
                [&::-webkit-scrollbar-thumb]:rounded-full
                [&::-webkit-scrollbar-thumb]:bg-neutral-800
                hover:[&::-webkit-scrollbar-thumb]:bg-neutral-700">

        <div class="nothing-found flex flex-col items-center justify-center text-center gap-3 py-16 px-6
                    rounded-2xl border border-neutral-700 bg-gray-950">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                 class="stroke-neutral-400">
                <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path>
                <path d="M21 21l-6 -6"></path>
            </svg>
            <p class="font-bold text-[1.05rem]">Начните вводить название</p>
            <p class="!text-neutral-400 text-sm max-w-80 font-mono">
                Результаты появятся по мере ввода
            </p>
        </div>
    </div>
</dialog>
