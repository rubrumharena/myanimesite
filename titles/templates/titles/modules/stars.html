{% load utils %}

{% with fills=rating|star_fill %}
    <div data-rating-stars data-value="{{ rating|floatformat:1 }}"
         class="w-fit select-none touch-none cursor-pointer" title="Поставить оценку">
        <ul class="flex">
            {% for star_num, fill in fills.items %}
                <li class="star" data-index="{{ star_num }}">
                    <svg width="2rem" height="2rem" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <clipPath id="{{ scope }}-star-{{ star_num }}">
                                <path d="M234.00977,115.47367,188.77539,153.1221l14.35938,58.07813a16.64744,16.64744,0,0,1-6.35938,17.67969,16.14026,16.14026,0,0,1-18.20312.5625l-50.4375-31.95313c-.14063-.07812-.20313-.04687-.26563,0l-46.875,29.69531a17.83088,17.83088,0,0,1-20.0625-.625A18.37492,18.37492,0,0,1,53.916,207.044l13.51562-53.16406-45.4375-38.40625a16.68222,16.68222,0,0,1-5.15625-18.0625A16.37036,16.37036,0,0,1,31.36914,86.044L90.43164,82.208,112.791,26.41117a16.324,16.324,0,0,1,15.1875-10.41407h.01562a16.33117,16.33117,0,0,1,15.21875,10.41407l22.03125,55.47656L224.63477,86.044A16.37036,16.37036,0,0,1,239.166,97.41117,16.68222,16.68222,0,0,1,234.00977,115.47367Z"></path>
                            </clipPath>
                        </defs>
                        <rect class="rect-gold h-full transition-[width] duration-150"
                              fill="var(--rating-color)" width="{{ fill }}%"
                              clip-path="url(#{{ scope }}-star-{{ star_num }})"></rect>
                        <rect class="rect-gray fill-neutral-700 w-full h-full transition-[x] duration-150"
                              x="{{ fill }}%"
                              clip-path="url(#{{ scope }}-star-{{ star_num }})"></rect>
                    </svg>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endwith %}
