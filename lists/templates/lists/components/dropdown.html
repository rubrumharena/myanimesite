<div>
    {% if label %}
        <span class="font-mono text-xs !text-neutral-400 mb-3 block">{{ label }}</span>
    {% endif %}

    <details class="library-filter relative w-full" id="{{ id }}" name="sidebar-filters">
        <summary
                class="check-button w-full justify-between gap-2 whitespace-nowrap leading-none cursor-pointer list-none select-none">
                            <span class="library-filter__label">
                                {% for f in filters %}
                                    {% if f.is_selected %}
                                        {{ f.name }}
                                    {% endif %}
                                {% endfor %}
                            </span>
            <svg class="library-filter__chevron shrink-0 transition-transform"
                 xmlns="http://www.w3.org/2000/svg"
                 width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6l6 -6"></path>
            </svg>
        </summary>

        <div class="absolute flex flex-col gap-1 left-0 top-full mt-1 z-50 w-full max-h-72 overflow-y-auto scrollbar-hide p-1.5 rounded-xl
                                    bg-gray-950 border border-neutral-700 shadow-[0_16px_40px_rgba(0,0,0,.6)]">
            {% for f in filters %}
                <a href="{{ f.url }}{{ qp }}"
                   class="flex items-center justify-between gap-3 h-9 px-3 shrink-0 rounded-lg cursor-pointer text-sm font-bold transition-colors {% if year.is_selected %}bg-(--accent)/10 !text-(--accent){% else %}!text-neutral-400 hover:bg-neutral-400/10 hover:!text-white{% endif %}">
                    {{ f.name }}
                </a>
            {% endfor %}
        </div>
    </details>
</div>
