{% load static %}

<button data-open="folder-popup" data-url="{% url 'lists:folder_form' %}?title_id={{ title.id }}"
        title="Создать новую папку" class="popover-button">
    <svg class="shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5l0 14"></path>
        <path d="M5 12l14 0"></path>
    </svg>
    Создать папку
</button>

{% if folders %}
    <div class="h-px my-1 mx-2 bg-neutral-700 shrink-0"></div>

    <ul class="flex flex-col gap-1 max-h-56 overflow-y-auto min-h-0 scrollbar-hide">
        {% for folder in folders %}
            <li>
                <button data-action-url="{% url 'lists:toggle_folder_title' folder.id title.id %}"
                        data-reload-url="{% url 'lists:get_folders' title.id %}"
                        title="{% if folder.is_checked %}Убрать из «{{ folder.name }}»{% else %}Добавить в «{{ folder.name }}»{% endif %}"
                        class="w-full flex items-center gap-3 h-9 px-3 shrink-0 rounded-lg cursor-pointer
                                   text-sm font-bold select-none transition-colors
                                   {% if folder.is_checked %}!text-cyan-400 hover:bg-cyan-400/10{% else %}!text-neutral-400 hover:bg-neutral-400/10 hover:!text-white{% endif %}">

                    {% if folder.is_pinned %}
                        <svg class="shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4"></path>
                            <path d="M9 15l-4.5 4.5"></path>
                            <path d="M14.5 4l5.5 5.5"></path>
                        </svg>
                    {% else %}
                        <svg class="shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"></path>
                        </svg>
                    {% endif %}

                    <span class="flex-1 truncate text-left">{{ folder.name }}</span>

                    {% if folder.is_checked %}
                        <svg class="shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12l5 5l10 -10"></path>
                        </svg>
                    {% endif %}
                </button>
            </li>
        {% endfor %}
    </ul>
{% endif %}
