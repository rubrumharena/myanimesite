server {
    listen 80;
    server_name rubrumharena.me www.rubrumharena.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rubrumharena.me$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rubrumharena.me www.rubrumharena.me;

    ssl_certificate     /etc/letsencrypt/live/rubrumharena.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubrumharena.me/privkey.pem;

    client_max_body_size 20M;

    location /media/ {
        alias /media/;
    }

    location /health/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
