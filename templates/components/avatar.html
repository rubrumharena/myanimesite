{% load i18n %}
{% load static %}
{% if request.user.is_authenticated %}
    <button {% if popover %}id="controls-button" popovertarget="controls-popover" data-target="controls-popover"
            title="{% translate 'Открыть меню аккаунта' %}"{% endif %}
            class="{{ frame_dim }} bg-linear-to-b to-pink-950 from-pink-500 flex-center rounded-full overflow-hidden shrink-0">
        <img class="{{ image_dim }} rounded-full object-cover object-center"
             src="{% if image %}{{ image.url }}{% else %}{% static 'vendor/img/utility/miku.svg' %}{% endif %}"
             alt="">
    </button>
{% else %}
    <a href="{% url 'accounts:welcome' %}"
            class="{{ frame_dim }} bg-linear-to-b to-pink-950 from-pink-500 flex-center rounded-full overflow-hidden shrink-0">
        <img class="{{ image_dim }} rounded-full object-cover object-center"
             src="{% if image %}{{ image.url }}{% else %}{% static 'vendor/img/utility/miku.svg' %}{% endif %}"
             alt="">
    </a>
{% endif %}
