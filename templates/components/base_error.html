{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'vendor/img/favicon/favicon.ico' %}"/>
    <title>{{ title }} | MYANIMESITE</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="{% static 'vendor/css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-950 text-white">
    {# Картинка — фон справа (на телефоне на весь экран), текст поверх градиента, поэтому ничего не сжимается #}
    <main class="relative min-h-dvh overflow-hidden flex items-end px-6 pb-16 md:items-center md:px-30 md:pb-0">

        <img class="absolute inset-0 w-full h-full object-cover object-[75%_center] pointer-events-none select-none
                    md:left-auto md:w-auto md:max-w-none md:object-contain md:object-right"
             src="{% static 'vendor/img/404.png' %}"
             alt="" aria-hidden="true" draggable="false">

        <div aria-hidden="true"
             class="pointer-events-none absolute inset-0
                    bg-[linear-gradient(to_top,var(--color-gray-950)_25%,transparent_75%)]
                    md:bg-[linear-gradient(to_right,var(--color-gray-950)_30%,transparent_65%)]"></div>

        <div aria-hidden="true"
             class="pointer-events-none absolute -top-80 -left-28 w-5xl h-200 max-md:w-full max-md:left-0
                    bg-[radial-gradient(rgba(234,58,217,0.3),transparent_70%)]"></div>

        <div class="relative z-20 max-w-md md:max-w-lg">
            <h1 class="text-4xl font-bold leading-tight text-pretty md:text-5xl">
                {{ title }}
            </h1>
            <p class="!text-stone-400 leading-[1.65] text-pretty mt-4 mb-8 md:mt-6 md:mb-12">
                {{ text }}
            </p>
            <a class="main-button inline-flex px-6"
               href="{% url 'index' %}">{% translate "Перейти на главную страницу" %}</a>
        </div>
    </main>
</body>
</html>
