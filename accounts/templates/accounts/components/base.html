{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'vendor/img/favicon/favicon.ico' %}"/>
    <title>{{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="{% static 'vendor/css/output.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/css/utils.css' %}" rel="stylesheet">

    {% block scripts %}
    {% endblock %}
</head>
<body class="overflow-x-hidden bg-slate-950">

<nav class="navbar !bg-none max-md:flex max-md:justify-center max-md:px-3!">
    <a href="{% url 'index' %}" title="{% translate 'На главную' %}">
        <img class="w-52 shrink-0 md:w-75" src="{% static 'vendor/img/utility/desktop-logo.webp' %}" alt="MYANIMESITE">
    </a>
</nav>

<main class="flex-center">
    <div class="absolute w-full h-125 z-1 pointer-events-none -top-60 left-0 md:w-5xl md:h-200 md:-top-80 md:-left-28
                bg-[radial-gradient(rgba(234,58,217,0.3),transparent_70%)]" aria-hidden="true"></div>

    <div class="relative z-10 flex flex-col items-center py-6 w-full h-fit mb-8 rounded-3xl
                bg-transparent md:py-10 md:w-162.5 md:border md:border-neutral-700">
        <div class="w-52 h-36 rounded-lg border-b-2 border-neutral-700 overflow-hidden">
            <img class="w-full h-full px-4" src="{% static 'vendor/img/gifs/auth.gif' %}"
                 alt="" aria-hidden="true">
        </div>

        {% block content %}
        {% endblock %}
    </div>
</main>

</body>
</html>
