<div class="w-full px-16 mt-6 flex flex-col items-center text-center">
    {% if icon %}
        <div class="flex-center w-14 h-14 rounded-full border-2 {{ class }}">
            {% include 'icons/'|add:icon|add:'.html' %}
        </div>
        <p class="font-mono text-xs !text-neutral-400 mt-6">{{ icon_title }}</p>
    {% endif %}

    <h1 class="text-2xl font-bold leading-tight mt-2">{{ title }}</h1>
    <p class="!text-neutral-400 leading-[1.65] mt-4">
        {{ text }}
    </p>

    {% if redirect == 'login' %}
        <a href="{% url 'accounts:login' %}" class="main-button h-12 w-full mt-8">Войти</a>
    {% elif redirect == 'recovery' %}
        <a href="{% url 'index' %}" class="mt-4 text-sm !text-neutral-400 hover:!text-cyan-400 transition-colors">
            На главную
        </a>
        <a href="{% url 'accounts:recovery' %}" class="main-button h-12 w-full mt-8">Запросить новую</a>
    {% elif else %}
        <a href="{% url 'index' %}" class="main-button h-12 w-full mt-8">На главную</a>
    {% endif %}
</div>
